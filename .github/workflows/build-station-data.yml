name: Build station data

# Weekly: station license/technical changes (new grants, power/site
# modifications) are infrequent enough that daily runs would mostly
# just add empty commits to gh-pages for no real freshness gain - CDBS
# never changes at all, and LMS churn is slow. workflow_dispatch stays
# available for on-demand refreshes.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * 0" # Sundays at 09:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Fortran build toolchain (for grwave)
        run: sudo apt-get update && sudo apt-get install -y gfortran cmake ninja-build

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch LMS tables (current data, refreshed daily upstream)
        run: python scripts/fetch_lms_data.py

      - name: Fetch CDBS tables (frozen legacy backfill)
        run: python scripts/fetch_cdbs_data.py

      - name: Parse and partition into Plus Code files
        run: python scripts/parse_stations.py

      - name: Commit updated station data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/plus4
          if git diff --cached --quiet; then
            echo "No changes to station data."
          else
            git commit -m "Refresh station data"
            git push
          fi
